apiVersion: apps/v1
kind: Deployment
metadata: { name: yararun, labels: { app: yararun } }
spec:
  replicas: 1
  selector: { matchLabels: { app: yararun } }
  template:
    metadata: { labels: { app: yararun } }
    spec:
      containers:
        - name: yararun
          image: ghcr.io/cognis-digital/yararun:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: yararun }
spec:
  selector: { app: yararun }
  ports: [{ port: 80, targetPort: 8000 }]
